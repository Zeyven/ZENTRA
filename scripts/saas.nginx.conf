server {
 listen 80;
 server_name saas.zephael.cn;
 location ^~ /.well-known/acme-challenge/ { root /opt/za-spa-saas/acme; }
 location / { return 301 https://saas.zephael.cn$request_uri; }
 access_log /var/log/nginx/za-spa-saas.access.log;
 error_log /var/log/nginx/za-spa-saas.error.log warn;
}
server {
 listen 443 ssl;
 server_name saas.zephael.cn;
 ssl_certificate /opt/za-spa-saas/certbot/live/saas.zephael.cn/fullchain.pem;
 ssl_certificate_key /opt/za-spa-saas/certbot/live/saas.zephael.cn/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /opt/za-spa-saas/current/apps/client/out/web;
 index index.html;
 client_max_body_size 256k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://saas.zephael.cn; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location = /ready {
  proxy_pass http://127.0.0.1:8791;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location /api/ {
  error_page 413 = @api_request_too_large;
  proxy_pass http://127.0.0.1:8791;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 40s;
  proxy_buffering off;
 }
 location /socket.io/ {
  proxy_pass http://127.0.0.1:8791;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 75s;
 }
 location @api_request_too_large {
  default_type application/json;
  return 413 '{"ok":false,"code":"REQUEST_TOO_LARGE","message":"提交内容过大，请减少内容后重试。"}';
 }
 location /updates/windows/rc/ { alias /opt/za-spa-saas/updates/windows/rc/; }
 location /updates/windows/stable/ { alias /opt/za-spa-saas/updates/windows/stable/; }
 location /assets/ { try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
 access_log /var/log/nginx/za-spa-saas.access.log;
 error_log /var/log/nginx/za-spa-saas.error.log warn;
}
