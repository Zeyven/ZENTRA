<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>澜序 · 虚拟点钟王</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102d28;color:#edf3e9;font:16px system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:38px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:30px;margin:6px 0}small,.muted{color:#b5c9be}.badge{padding:10px 16px;border:1px solid #aabd8b;border-radius:24px;color:#d4e3b5}.notice{background:#23443a;padding:16px;border-radius:12px;line-height:1.8;margin:24px 0}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}.panel{background:#f4f5ed;color:#173b30;border-radius:24px;padding:28px}h2{margin:0 0 20px}.room{font-size:70px;letter-spacing:4px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:24px}button,select{font:inherit;border-radius:12px;padding:15px;border:1px solid #c6d4c8}button{background:#245445;color:white;cursor:pointer}button:hover{background:#376b56}button:disabled{opacity:.5;cursor:wait}select{width:100%;background:white;color:#173b30}label{display:block;margin:20px 0 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 monospace;background:#0d241f;color:#cee4d6;padding:20px;border-radius:16px;max-height:430px;overflow:auto}.status{padding:15px;border-radius:12px;background:#e0e7db;line-height:1.7}.status.bad{background:#f6ddd2;color:#873326}.status.good{background:#d8ebd7}footer{margin-top:24px;color:#b5c9be;font-size:13px;line-height:1.8}@media(max-width:760px){.layout{grid-template-columns:1fr}header{align-items:flex-start}.badge{font-size:12px}.room{font-size:52px}}
</style><main><header><div><small>ZA THERA · PROTOCOL LAB</small><h1>虚拟点钟王</h1></div><span class="badge">本机模拟 · 不接营业数据</span></header>
<div class="notice">这是软件协议测试面板。房间、技师与服务均为模拟数据；按钮通过真实本地 TCP 连接测试网关。登录、上钟、加钟和下钟尚未完成厂商适配，点击后会返回明确的拒绝结果。</div>
<div class="layout"><section class="panel"><small style="color:#557565">模拟房间绑定</small><div class="room">SIM203</div><p>仅用于协议身份校验；不提供模拟房态、技师或订单数据。</p><label for="scenario">测试场景</label><select id="scenario"><option value="normal">正常绑定 / 验证拒绝结果</option><option value="unbound">设备未绑定</option><option value="cloud_failure">模拟云端查询失败</option></select><div class="grid"><button data-action="SystemClockInfo">查询房态</button><button data-action="SystemDeviceLogin">设备登录</button><button data-action="SystemUserLogin">技师登录</button><button data-action="ReportClock">上钟</button><button data-action="AddClock">加钟</button><button data-action="CloseClock">下钟</button></div></section>
<section class="panel"><h2>设备反馈</h2><div id="status" role="status" class="status">等待操作。点击“查询房态”开始。</div><p id="service">尚未接收房态应答。</p><pre id="wire">协议结果将在这里显示。</pre></section></div><footer>状态说明：模拟成功只代表本地测试通过，不代表真实点钟王兼容或实机验收通过。写入操作不生成订单、不扣款、不修改技师钟务。关闭页面不会停止本地测试服务。</footer></main>
<script>
const status=document.querySelector('#status'),wire=document.querySelector('#wire'),service=document.querySelector('#service'),scenario=document.querySelector('#scenario');
for(const button of document.querySelectorAll('button'))button.onclick=async()=>{
 const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);scenario.disabled=true;status.className='status';status.textContent='正在发送本地 TCP 请求…';service.textContent='';wire.textContent='等待应答…';
 try{const response=await fetch('/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:button.dataset.action,scenario:scenario.value}),signal:AbortSignal.timeout(6000)});const result=await response.json();if(!response.ok)throw Error(result.error);const answer=result.answer;const success=answer.exstatus===0&&answer.data.code===1;
 status.className='status '+(success?'good':'bad');status.textContent=success?'测试网关收到成功回执（非实机验证）':answer.exmsg;
 if(success){service.textContent=(answer.data.data.clock||[]).map(c=>[c.t1,c.t3,c.t4].join(' · ')).join('\n')}
 wire.textContent=JSON.stringify(result,null,2);
 }catch(e){status.className='status bad';status.textContent='测试连接失败：'+e.message;wire.textContent='未取得有效设备应答。'}finally{buttons.forEach(b=>b.disabled=false);scenario.disabled=false}
};
</script></html>
