# Development only. Ports are loopback-bound; never deploy this file as production.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: migration_role
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init}
      POSTGRES_DB: ayra
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD:?Run pnpm env:init}
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U migration_role -d ayra']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.2.1
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
  temporal:
    image: temporalio/temporal:1.9.1
    command:
      [
        'server',
        'start-dev',
        '--ip',
        '0.0.0.0',
        '--db-filename',
        '/data/temporal.db',
        '--namespace',
        'ayra-development',
      ]
    ports: ['127.0.0.1:7233:7233', '127.0.0.1:8233:8233']
    volumes: ['temporal-data:/data']
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      retries: 30
  object-store:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run pnpm env:init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run pnpm env:init}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['object-data:/data']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 30
  object-store-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run pnpm env:init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run pnpm env:init}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?Run pnpm env:init}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        mc alias set local http://object-store:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$OBJECT_STORE_BUCKET" >/dev/null
        key=".health/$$(cat /proc/sys/kernel/random/uuid)"
        printf ayra-health | mc pipe "local/$$OBJECT_STORE_BUCKET/$$key" >/dev/null
        test "$$(mc cat "local/$$OBJECT_STORE_BUCKET/$$key")" = ayra-health
        mc rm "local/$$OBJECT_STORE_BUCKET/$$key" >/dev/null
volumes:
  postgres-data:
  temporal-data:
  object-data:
