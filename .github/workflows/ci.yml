name: AYRA engineering gates
on:
  pull_request:
    branches: [ZA-AYRA]
  push:
    branches: [ZA-AYRA]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ayra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm env:init
      - run: pnpm infra:up
      - run: pnpm infra:verify
      - run: pnpm test:temporal
      - run: pnpm migrate
      - run: pnpm test:integration
      - run: pnpm test:api
        env:
          AYRA_TEST_BUNDLED_WORKFLOW: '1'
      - run: pnpm test:core
      - if: failure()
        name: Temporal startup diagnostics
        run: docker compose --project-name ayra-local --env-file .env.local -f infrastructure/docker/compose.yaml logs --no-color --tail 80 temporal
      - if: always()
        run: pnpm infra:down
  desktop-native:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - if: matrix.os == 'windows-latest'
        run: pnpm build:desktop:preview:windows
      - if: matrix.os == 'windows-latest'
        name: Checksum unsigned Windows preview
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not created' }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii -Path "$($installer.FullName).sha256"
      - if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ayra-windows-unsigned-preview
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7
      - if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - if: matrix.os == 'macos-latest'
        run: pnpm build:desktop:preview:macos
      - if: matrix.os == 'macos-latest'
        name: Verify unsigned preview disk image
        shell: bash
        run: |
          dmg="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/AYRA_0.0.0_universal.dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ayra-macos-unsigned-preview
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/AYRA_0.0.0_universal.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/AYRA_0.0.0_universal.dmg.sha256
          if-no-files-found: error
          retention-days: 7
