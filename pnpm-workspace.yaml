packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@fastify/swagger@9.9.0'
  - '@next/env@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - next@16.3.6
  - prettier@3.9.9
  - '@clerk/backend@3.19.0'
  - '@clerk/shared@4.34.0'
  - '@aws-sdk/client-s3@3.1139.0'
  - '@aws-sdk/s3-request-presigner@3.1139.0'

verifyDepsBeforeRun: error
